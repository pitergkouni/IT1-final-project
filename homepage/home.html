<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home – Stream</title>
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="icon" type="image/webp" href="../assets/images/logoshape.webp" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <img src="../assets/images/logo.webp" alt="" />
      <nav>
        <button><i class="fa-regular fa-house"></i> Home</button>
        <button>
          <i class="fa-solid fa-table-cells-large"></i> Browse <i
            class="fa-solid fa-angle-down"
          ></i>
        </button>
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
        <button><i class="fa-regular fa-user"></i></button>
      </nav>
    </header>
    <main>
      <section class="watchNow"></section>
      <section>
        <h1>TOP 15 Today</h1>
        <button class="left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="right"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="premium-track"></div>
      </section>
      <section>
        <h1>Top 2026</h1>
        <button class="left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="right"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="track"></div>
      </section>
      <section>
        <h1>Top rated</h1>
        <button class="left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="right"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="track"></div>
      </section>
      <section>
        <h1>Action</h1>
        <button class="left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="right"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="track"></div>
      </section>
    </main>
    <footer></footer>
    <script src="home.js"></script>
  </body>
</html>
