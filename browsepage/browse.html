<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="browse.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="searchContainer">
      <div>
        <h3>Search</h3>
        <button><i class="fa-solid fa-x"></i></button>
      </div>
      <input type="search" placeholder="Type here to search.." />
    </div>
    <header>
      <img src="../assets/images/logo.webp" alt="" />
      <nav>
        <button onclick="location.href = '../homepage/home.html'">
          <i class="fa-regular fa-house"></i> Home
        </button>
        <button class="browse">
          <i class="fa-solid fa-table-cells-large"></i> Browse
          <i class="fa-solid fa-angle-down"></i>
        </button>
        <div onclick="location.href = 'browse.html'" class="dropdown">
          <div>
            <button><i class="fa-solid fa-clapperboard"></i></button>
            <p>Movies</p>
          </div>
          <div>
            <button><i class="fa-solid fa-tv"></i></button>
            <p>TV Shows</p>
          </div>
          <button>
            <i class="fa-solid fa-clock-rotate-left"></i>
            <p>History</p>
          </button>
          <button>
            <i class="fa-regular fa-heart"></i>
            <p>Watchlist</p>
          </button>
        </div>
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
        <button><i class="fa-regular fa-user"></i></button>
      </nav>
    </header>
    <main>
      <section class="browseCategories">
        <button>Most popular</button>
        <button>Drama</button>
        <button>Sci-Fi</button>
        <button>Action</button>
        <button>Animation</button>
        <button>Crime</button>
        <button>Biography</button>
        <button>Comedy</button>
        <button>Thriller</button>
        <button>Mystery</button>
        <button>Fantasy</button>
        <button>War</button>
        <button>Horror</button>
        <button>Adventure</button>
        <button>Western</button>
        <button>Romance</button>
        <button>Musical</button>
      </section>
      <section class="filmWrapper"></section>
    </main>
    <script src="../global.js" type="module"></script>
    <script src="browse.js" type="module"></script>
  </body>
</html>
